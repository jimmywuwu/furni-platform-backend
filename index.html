<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>David Field</title>
  <style>
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #333; }
    .container { display: flex; height: 100vh; }
    .sidebar { width: 260px; background: #f4f4f4; padding: 40px 30px; border-right: 1px solid #ddd; box-sizing: border-box; }
    .logo { font-size: 28px; letter-spacing: 3px; margin-bottom: 40px; }
    .logo span { color: #c33; }
    .menu { list-style: none; padding: 0; }
    .menu li { margin: 20px 0; }
    .divider { border-top: 1px solid #ddd; margin: 30px 0; }
    .newsletter input { width: 100%; padding: 10px; margin-top: 10px; border: 1px solid #ddd; box-sizing: border-box; }
    .newsletter button { margin-top: 10px; padding: 10px 20px; background: #000; color: #fff; border: none; cursor: pointer; }
    .main { flex: 1; padding: 40px; overflow: auto; }
    .hero { position: relative; height: 320px; overflow: hidden; border-radius: 8px; }
    .slide { position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity .8s; }
    .slide.active { opacity: 1; }
    .slide img { width: 100%; height: 100%; object-fit: cover; }
    .arrow { position: absolute; top: 50%; transform: translateY(-50%); font-size: 24px; background: rgba(0,0,0,0.4); color: #fff; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; }
    .arrow.left { left: 10px; }
    .arrow.right { right: 10px; }
    .title { text-align: center; margin: 30px 0; }
    .feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; }
    .product-card { text-decoration: none; color: #333; transition: .2s; cursor: pointer; }
    .product-card:hover { transform: translateY(-4px); }
    .product-img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; background: #eee; }
    .product-name { font-weight: 600; font-size: 14px; margin-top: 8px; }
    .product-price { font-size: 13px; color: #888; margin-top: 4px; }
    .drawer { position: fixed; top: 0; right: -420px; width: 420px; height: 100%; background: #fff; box-shadow: -4px 0 20px rgba(0,0,0,0.15); transition: right .3s; z-index: 1000; }
    .drawer.open { right: 0; }
    .drawer-content { padding: 30px; position: relative; }
    .drawer-close { position: absolute; top: 20px; right: 20px; cursor: pointer; font-size: 20px; border: none; background: transparent; }
    .drawer-img { width: 100%; height: 240px; object-fit: cover; border-radius: 6px; background: #eee; }
    .drawer-meta { margin-top: 20px; color: #555; line-height: 1.7; }
    .drawer-actions { margin-top: 20px; display: flex; gap: 10px; }
    .btn-primary, .btn-secondary { flex: 1; padding: 12px; cursor: pointer; }
    .btn-primary { background: #000; color: #fff; border: none; }
    .btn-secondary { border: 1px solid #ddd; background: #fff; }
    .loader { margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fill,minmax(220px,1fr)); gap: 24px; }
    .skeleton { background: #eee; height: 180px; border-radius: 6px; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%{opacity:.6} 50%{opacity:1} 100%{opacity:.6} }
    .spinner-wrapper { display: none; justify-content: center; align-items: center; margin: 24px 0; }
    .spinner { width: 32px; height: 32px; border: 3px solid #eee; border-top: 3px solid #333; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    .login-modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:2000; }
    .login-box { background:#fff; padding:30px; width:360px; border-radius:8px; }
    .line-login-btn { margin-top: 16px; background:#06C755; color:#fff; border:none; padding:12px 20px; width:100%; cursor:pointer; }
    .login-close { margin-top: 12px; color:#888; cursor:pointer; text-align:center; }
  </style>
</head>
<body>
  <div id="productDrawer" class="drawer">
    <div class="drawer-content">
      <button class="drawer-close" onclick="closeDrawer()">✕</button>
      <img id="drawerImage" class="drawer-img" alt="product" />
      <h2 id="drawerTitle"></h2>
      <div class="drawer-meta">
        <div>SKU: <span id="drawerSku"></span></div>
        <div>庫存: <span id="drawerStock"></span></div>
      </div>
      <div class="drawer-actions">
        <button id="stockBtn" class="btn-primary">加入到店查看清單</button>
        <button id="wishBtn" class="btn-secondary">加入收藏清單</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="sidebar">
      <div class="logo">D<span>A</span>VID F<span>I</span>ELD</div>
      <ul class="menu">
        <li>HOME</li>
        <li>新品推薦</li>
        <li>居家靈感</li>
        <li>場景收藏</li>
        <li>門市清單</li>
      </ul>
      <div class="divider"></div>
      <div class="newsletter">
        訂閱電子報<br />
        <input placeholder="請輸入電子郵件" />
        <button>訂閱</button>
      </div>
    </div>

    <div class="main">
      <div class="hero">
        <div class="slide active"><img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85" alt="hero1" /></div>
        <div class="slide"><img src="https://images.unsplash.com/photo-1493666438817-866a91353ca9" alt="hero2" /></div>
        <div class="slide"><img src="https://images.unsplash.com/photo-1519710164239-da123dc03ef4" alt="hero3" /></div>
        <button class="arrow left" onclick="prevSlide()">‹</button>
        <button class="arrow right" onclick="nextSlide()">›</button>
      </div>

      <div class="title">
        <h1>精選家具</h1>
        <p>探索最新商品並加入收藏或到店查看清單</p>
      </div>

      <div id="productFeed" class="feed"></div>
      <div id="loader" class="loader"></div>
      <div id="spinner" class="spinner-wrapper"><div class="spinner"></div></div>
    </div>
  </div>

  <div id="loginModal" class="login-modal">
    <div class="login-box">
      <h3>登入後可使用完整功能</h3>
      <p>登入後可以：</p>
      <ul>
        <li>加入收藏清單</li>
        <li>建立到店查看清單</li>
        <li>同步你的場景收藏</li>
      </ul>
      <button class="line-login-btn" onclick="lineLogin()">LINE 登入</button>
      <div class="login-close" onclick="closeLogin()">稍後再說</div>
    </div>
  </div>

  <script>
    let slides = document.querySelectorAll('.slide');
    let index = 0;
    function showSlide(i){ slides.forEach(s => s.classList.remove('active')); slides[i].classList.add('active'); }
    function nextSlide(){ index = (index + 1) % slides.length; showSlide(index); }
    function prevSlide(){ index = (index - 1 + slides.length) % slides.length; showSlide(index); }
    setInterval(nextSlide, 4000);

    const API_PREFIX = '/api/v1';
    const USER_ID = 1;
    let cursor = 0;
    let loading = false;
    const limit = 20;
    let loadedItems = 0;
    let userLoggedIn = false;

    function showLoader(){
      document.getElementById('spinner').style.display = 'flex';
      document.getElementById('loader').innerHTML = Array(8).fill('<div class="skeleton"></div>').join('');
    }
    function hideLoader(){
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('loader').innerHTML = '';
    }

    function appendFeed(items){
      const container = document.getElementById('productFeed');
      items
        .filter(i => i.type === 'product')
        .forEach(p => {
          const card = document.createElement('a');
          card.className = 'product-card';
          card.onclick = () => openProduct(p.id);

          const img = document.createElement('img');
          img.className = 'product-img';
          img.src = p.image || '';
          img.alt = p.name || '';

          const name = document.createElement('div');
          name.className = 'product-name';
          name.textContent = p.name || '';

          const price = document.createElement('div');
          price.className = 'product-price';
          price.textContent = `$${(p.price === null || p.price === undefined) ? '' : p.price}`;

          card.appendChild(img);
          card.appendChild(name);
          card.appendChild(price);
          container.appendChild(card);
        });
    }

    async function loadFeed(){
      if (loading) return;
      loading = true;
      showLoader();
      try {
        const res = await fetch(`${API_PREFIX}/feed?cursor=${cursor}&limit=${limit}`);
        const data = await res.json();
        appendFeed(data.items || []);
        cursor = (data.next_cursor === null || data.next_cursor === undefined) ? cursor : data.next_cursor;
        loadedItems += (data.items || []).length;
        if (!userLoggedIn && loadedItems >= 40) showLogin();
      } catch (err) {
        console.error('loadFeed error', err);
      } finally {
        hideLoader();
        loading = false;
      }
    }

    async function openProduct(id){
      try {
        const res = await fetch(`${API_PREFIX}/products/${id}`);
        const product = await res.json();
        const drawer = document.getElementById('productDrawer');

        document.getElementById('drawerTitle').innerText = product.name || '';
        document.getElementById('drawerImage').src = product.cover_image_url || '';
        document.getElementById('drawerSku').innerText = product.product_code || product.id;

        const stockAvailable = product.variants && product.variants.some(v => (v.stock || 0) > 0);
        document.getElementById('drawerStock').innerText = stockAvailable ? '有庫存' : '缺貨';

        const stockBtn = document.getElementById('stockBtn');
        const wishBtn = document.getElementById('wishBtn');

        if (stockAvailable) {
          stockBtn.style.display = 'block';
          wishBtn.style.display = 'none';
        } else {
          stockBtn.style.display = 'none';
          wishBtn.style.display = 'block';
        }

        stockBtn.onclick = async () => {
          if (!userLoggedIn) return showLogin();
          const variantId =
            product &&
            product.variants &&
            product.variants[0] &&
            product.variants[0].id
              ? product.variants[0].id
              : null;
          if (!variantId) return;
          await fetch(`${API_PREFIX}/viewlist/items`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: USER_ID, variant_id: variantId, quantity: 1 })
          });
          alert('已加入到店查看清單');
        };

        wishBtn.onclick = async () => {
          if (!userLoggedIn) return showLogin();
          await fetch(`${API_PREFIX}/wishlist/items`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: USER_ID, product_id: product.id })
          });
          alert('已加入收藏清單');
        };

        drawer.classList.add('open');
      } catch (err) {
        console.error('openProduct error', err);
      }
    }

    function closeDrawer(){ document.getElementById('productDrawer').classList.remove('open'); }
    function showLogin(){ document.getElementById('loginModal').style.display = 'flex'; }
    function closeLogin(){ document.getElementById('loginModal').style.display = 'none'; }
    function lineLogin(){ userLoggedIn = true; closeLogin(); alert('Demo: 已視為登入'); }

    const scrollContainer = document.querySelector('.main');
    scrollContainer.addEventListener('scroll', () => {
      if (scrollContainer.scrollTop + scrollContainer.clientHeight >= scrollContainer.scrollHeight - 300) loadFeed();
    });

    loadFeed();
  </script>
</body>
</html>
